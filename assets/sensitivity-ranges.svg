    <text x="72" y="443" fill="#1f2328">3 · Digital Geeks</text><line x1="786" y1="433" x2="1004" y2="433" stroke="#8c959f" stroke-width="28"/><circle cx="786" cy="433" r="14" fill="#6e7781"/><circle cx="1004" cy="433" r="14" fill="#6e7781"/><text x="753" y="405" fill="#57606a" font-size="18">42,94</text><text x="957" y="405" fill="#57606a" font-size="18">54,41</text>
