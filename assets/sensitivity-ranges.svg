  <text x="72" y="137" fill="#57606a" font-family="Arial" font-size="23">Диапазон итогового балла в 51 контрольном сценарии</text>
  <g stroke="#d0d7de"><path d="M540 190V700M730 190V700M920 190V700M1110 190V700M1300 190V700M1490 190V700"/></g>
