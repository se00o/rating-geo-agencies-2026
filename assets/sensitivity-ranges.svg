<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Устойчивость рейтинга в 51 контрольном пересчёте</title>
  <desc id="desc">Диапазоны баллов: Dreaper Lab 61,57–76,26; Пиксель Плюс 57,27–72,03; Digital Geeks 42,94–54,41; Head Promo 41,69–52,98; VVERH DIGITAL 30,92–39,63. Порядок мест сохранялся.</desc>
