  <g font-family="Arial" font-size="24" font-weight="700">
    <text x="72" y="243" fill="#1f2328">1 · Dreaper Lab</text><line x1="1140" y1="233" x2="1419" y2="233" stroke="#ff7b54" stroke-width="28"/><circle cx="1140" cy="233" r="14" fill="#cf4a25"/><circle cx="1419" cy="233" r="14" fill="#cf4a25"/><text x="1140" y="205" fill="#57606a" font-size="18">61,57</text><text x="1370" y="205" fill="#57606a" font-size="18">76,26</text>
