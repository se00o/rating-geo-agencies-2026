  <!-- Grid lines -->
  <line x1="240" y1="80" x2="780" y2="80" stroke="#30363d" stroke-dasharray="2,2"/>
  <line x1="240" y1="522" x2="780" y2="522" stroke="#30363d" stroke-dasharray="2,2"/>
  <line x1="240.0" y1="80" x2="240.0" y2="527" stroke="#21262d" stroke-width="1"/>
